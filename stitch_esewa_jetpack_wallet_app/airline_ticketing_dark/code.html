<script>
        function toggleTripType(type) {
            const btnOneWay = document.getElementById('toggle-oneway');
            const btnRoundTrip = document.getElementById('toggle-roundtrip');
            const returnContainer = document.getElementById('return-date-container');

            const activeClass = ['bg-primary', 'text-white', 'shadow-md', 'font-semibold'];
            const inactiveClass = ['text-gray-400', 'hover:text-white', 'bg-transparent'];

            if (type === 'oneway') {
                // Set One Way Active
                btnOneWay.classList.add(...activeClass);
                btnOneWay.classList.remove(...inactiveClass);
                
                // Set Round Trip Inactive
                btnRoundTrip.classList.add(...inactiveClass);
                btnRoundTrip.classList.remove(...activeClass);

                // Hide/Disable Return Date
                returnContainer.classList.add('opacity-50', 'pointer-events-none');
            } else {
                // Set Round Trip Active
                btnRoundTrip.classList.add(...activeClass);
                btnRoundTrip.classList.remove(...inactiveClass);
                
                // Set One Way Inactive
                btnOneWay.classList.add(...inactiveClass);
                btnOneWay.classList.remove(...activeClass);

                // Show/Enable Return Date
                returnContainer.classList.remove('opacity-50', 'pointer-events-none');
            }
        }
    </script>
