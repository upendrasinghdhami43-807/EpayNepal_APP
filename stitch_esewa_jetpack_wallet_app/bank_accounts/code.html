<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: theme('colors.background');
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-primary dark:bg-primary text-on-primary dark:text-on-primary flex justify-between items-center w-full px-margin-mobile py-4 docked full-width top-0 rounded-b-3xl shadow-none z-10 relative">
<div class="flex items-center gap-4">
<button class="p-2 -ml-2 rounded-full hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-title-lg font-title-lg font-bold text-on-primary">Bank Accounts</h1>
</div>
<button class="p-2 -mr-2 rounded-full hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined">more_vert</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 px-margin-mobile py-stack-lg flex flex-col gap-stack-md z-0 pb-24">
<!-- Header Text -->
<div class="mb-2">
<h2 class="text-title-md font-title-md text-on-surface">Linked Banks</h2>
<p class="text-body-md font-body-md text-on-surface-variant mt-1">Manage your connected bank accounts for seamless transactions.</p>
</div>
<!-- Bank Account Card 1 -->
<div class="bg-surface-container-low rounded-[24px] p-4 flex items-center justify-between shadow-sm relative overflow-hidden group">
<div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
<div class="flex items-center gap-4 relative z-10">
<div class="w-12 h-12 bg-white rounded-xl shadow-sm flex items-center justify-center border border-surface-variant overflow-hidden shrink-0">
<!-- Placeholder for Bank Logo -->
<span class="material-symbols-outlined text-primary text-2xl">account_balance</span>
</div>
<div>
<h3 class="text-title-md font-title-md text-on-surface">Global IME Bank</h3>
<p class="text-body-md font-body-md text-on-surface-variant flex items-center gap-1 mt-0.5">
<span>•••• •••• •••• 4521</span>
<span class="w-1 h-1 bg-on-surface-variant rounded-full mx-1"></span>
<span>Savings</span>
</p>
</div>
</div>
<button class="p-2 rounded-full hover:bg-surface-variant transition-colors relative z-10 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
</button>
</div>
<!-- Bank Account Card 2 -->
<div class="bg-surface-container-low rounded-[24px] p-4 flex items-center justify-between shadow-sm relative overflow-hidden group">
<div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
<div class="flex items-center gap-4 relative z-10">
<div class="w-12 h-12 bg-white rounded-xl shadow-sm flex items-center justify-center border border-surface-variant overflow-hidden shrink-0">
<!-- Placeholder for Bank Logo -->
<span class="material-symbols-outlined text-primary text-2xl">account_balance</span>
</div>
<div>
<h3 class="text-title-md font-title-md text-on-surface">Nabil Bank</h3>
<p class="text-body-md font-body-md text-on-surface-variant flex items-center gap-1 mt-0.5">
<span>•••• •••• •••• 8902</span>
<span class="w-1 h-1 bg-on-surface-variant rounded-full mx-1"></span>
<span>Current</span>
</p>
</div>
</div>
<button class="p-2 rounded-full hover:bg-surface-variant transition-colors relative z-10 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
</button>
</div>
</main>
<!-- Bottom Action Button (Fixed) -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-gradient-to-t from-background via-background to-transparent z-20 pb-8">
<button class="w-full bg-primary text-on-primary rounded-full py-4 flex items-center justify-center gap-2 shadow-lg shadow-primary/20 hover:bg-surface-tint transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]">add_link</span>
<span class="text-title-md font-title-md">Link New Bank Account</span>
</button>
</div>
</body></html>
