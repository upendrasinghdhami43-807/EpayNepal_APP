<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Education Fee Payment</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#1a1c18",
                        "on-primary": "#ffffff",
                        "secondary-container": "#e4e3da",
                        "tertiary-fixed": "#bcebed",
                        "primary": "#006e0d",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e3e3db",
                        "surface-bright": "#fafaf2",
                        "inverse-on-surface": "#f1f1e9",
                        "on-surface": "#1a1c18",
                        "on-secondary-fixed-variant": "#474741",
                        "inverse-surface": "#2f312c",
                        "on-primary-container": "#004d06",
                        "secondary-fixed-dim": "#c8c7bf",
                        "outline-variant": "#bccbb4",
                        "surface-container-low": "#f4f4ec",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "secondary": "#5e5f58",
                        "on-surface-variant": "#3d4a39",
                        "on-secondary-fixed": "#1b1c17",
                        "tertiary": "#396668",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "tertiary-container": "#88b6b8",
                        "primary-fixed": "#75ff69",
                        "on-primary-fixed": "#002201",
                        "on-tertiary-fixed-variant": "#1f4d50",
                        "surface-container-highest": "#e3e3db",
                        "primary-container": "#37c837",
                        "outline": "#6d7b68",
                        "on-secondary-container": "#64655e",
                        "surface-container": "#eeeee6",
                        "inverse-primary": "#54e24e",
                        "surface-dim": "#dadad3",
                        "on-tertiary-container": "#18484a",
                        "tertiary-fixed-dim": "#a0cfd1",
                        "secondary-fixed": "#e4e3da",
                        "surface-tint": "#006e0d",
                        "primary-fixed-dim": "#54e24e",
                        "surface": "#fafaf2",
                        "on-tertiary-fixed": "#002021",
                        "surface-container-high": "#e8e9e1",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#005307",
                        "background": "#fafaf2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "12px",
                        "stack-md": "16px",
                        "stack-lg": "24px",
                        "margin-desktop": "24px",
                        "stack-sm": "8px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "title-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "title-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400" }],
                        "label-lg": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1px", "fontWeight": "500" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }],
                        "title-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            }
            .icon-filled {
                font-variation-settings: 'FILL' 1;
            }
            .hide-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .hide-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen pb-24 md:pb-8 flex flex-col md:flex-row md:justify-center">
<!-- Mobile Top App Bar (Only visible on md:hidden since it's a sub-page flow, actually we should use a back arrow top bar) -->
<header class="md:hidden flex items-center justify-between px-margin-mobile py-4 bg-surface sticky top-0 z-40 border-b border-surface-variant/50 backdrop-blur-md bg-opacity-85">
<button class="p-2 -ml-2 text-on-surface-variant hover:bg-surface-variant/50 rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-title-lg font-title-lg text-on-surface text-center flex-1">Education Fee</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[600px] px-margin-mobile md:px-margin-desktop py-stack-md flex flex-col gap-stack-lg">
<!-- Search & Filter Section -->
<section class="flex flex-col gap-stack-md">
<!-- Search Input -->
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full bg-surface-container rounded-full py-4 pl-12 pr-4 text-body-lg font-body-lg text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary-container/50 border-none" placeholder="Search school, college, university..." type="text"/>
</div>
<!-- Categories -->
<div class="flex gap-gutter overflow-x-auto hide-scrollbar py-2">
<button class="flex-shrink-0 px-6 py-2 rounded-full bg-primary-container text-on-primary-container text-label-lg font-label-lg shadow-sm transition-transform active:scale-95 flex items-center gap-2">
<span class="material-symbols-outlined icon-filled text-[18px]">school</span>
                    School
                </button>
<button class="flex-shrink-0 px-6 py-2 rounded-full bg-surface-container-high text-on-surface-variant text-label-lg font-label-lg hover:bg-surface-variant/80 transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">account_balance</span>
                    College
                </button>
<button class="flex-shrink-0 px-6 py-2 rounded-full bg-surface-container-high text-on-surface-variant text-label-lg font-label-lg hover:bg-surface-variant/80 transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">business</span>
                    University
                </button>
<button class="flex-shrink-0 px-6 py-2 rounded-full bg-surface-container-high text-on-surface-variant text-label-lg font-label-lg hover:bg-surface-variant/80 transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">domain</span>
                    Hostel
                </button>
</div>
</section>
<!-- Direct Payment Form -->
<section class="bg-surface-container-lowest rounded-[24px] p-stack-md shadow-sm border border-surface-variant/30 flex flex-col gap-stack-md">
<h2 class="text-title-md font-title-md text-on-surface">Pay by Student ID</h2>
<div class="flex flex-col gap-2">
<label class="text-label-lg font-label-lg text-on-surface-variant px-1" for="institution">Select Institution</label>
<div class="relative">
<select class="w-full bg-surface-container rounded-[12px] py-4 px-4 pr-10 text-body-md font-body-md text-on-surface appearance-none focus:outline-none focus:ring-1 focus:ring-primary border-none" id="institution">
<option disabled="" selected="" value="">Select from list...</option>
<option value="1">Green Valley High School</option>
<option value="2">City College of Engineering</option>
<option value="3">State University</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-label-lg font-label-lg text-on-surface-variant px-1" for="studentId">Student ID</label>
<input class="w-full bg-surface-container rounded-[12px] py-4 px-4 text-body-md font-body-md text-on-surface placeholder-on-surface-variant/60 focus:outline-none focus:ring-1 focus:ring-primary border-none" id="studentId" placeholder="e.g. STU-2023-091" type="text"/>
</div>
<button class="w-full bg-primary-container text-on-primary-container py-4 rounded-full text-body-lg font-title-md font-semibold mt-2 shadow-[0_4px_12px_rgba(55,200,55,0.2)] active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
                Continue to Pay
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</section>
<!-- Recent Payments -->
<section class="flex flex-col gap-stack-md mt-4">
<div class="flex items-center justify-between">
<h2 class="text-title-md font-title-md text-on-surface">Recent Payments</h2>
<button class="text-label-lg font-label-lg text-primary hover:text-primary-container transition-colors">See All</button>
</div>
<div class="flex flex-col gap-3">
<!-- Recent Item 1 -->
<div class="bg-surface-container-lowest rounded-[24px] p-4 flex items-center justify-between hover:bg-surface-variant/30 cursor-pointer transition-colors shadow-[0_2px_8px_rgba(0,0,0,0.02)]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-[12px] bg-primary-container/20 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary-container text-[20px]">school</span>
</div>
<div class="flex flex-col">
<span class="text-body-md font-body-md font-medium text-on-surface">Green Valley High School</span>
<span class="text-label-lg font-label-lg text-on-surface-variant">ID: STU-8829 • Term 1 Fee</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="text-body-md font-title-md text-on-surface">$450.00</span>
<span class="text-[10px] font-label-lg text-on-surface-variant">12 Aug, 2023</span>
</div>
</div>
<!-- Recent Item 2 -->
<div class="bg-surface-container-lowest rounded-[24px] p-4 flex items-center justify-between hover:bg-surface-variant/30 cursor-pointer transition-colors shadow-[0_2px_8px_rgba(0,0,0,0.02)]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-[12px] bg-tertiary-container/20 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-tertiary text-[20px]">account_balance</span>
</div>
<div class="flex flex-col">
<span class="text-body-md font-body-md font-medium text-on-surface">City College</span>
<span class="text-label-lg font-label-lg text-on-surface-variant">ID: CC-991 • Exam Fee</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="text-body-md font-title-md text-on-surface">$120.00</span>
<span class="text-[10px] font-label-lg text-on-surface-variant">05 Jul, 2023</span>
</div>
</div>
</div>
</section>
</main>
<!-- Navigation omitted as per "Task-Focused: Any sub-page featuring a 'Close' or 'Back' action" rule -->
</body></html>
