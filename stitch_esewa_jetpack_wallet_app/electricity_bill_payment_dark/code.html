<body class="bg-background text-on-background min-h-screen flex flex-col md:hidden">
<!-- Top App Bar -->
<header class="bg-primary dark:bg-primary text-on-primary dark:text-on-primary shadow-none w-full px-margin-mobile py-4 flex justify-between items-center rounded-b-3xl sticky top-0 z-40 h-[72px]">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-black/20 transition-transform duration-150 active:scale-95 text-on-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="text-headline-md-mobile font-headline-md-mobile text-on-primary">Pay Electricity Bill</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-black/20 transition-transform duration-150 active:scale-95 text-on-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">help_outline</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile pt-stack-lg pb-[100px] flex flex-col gap-stack-lg">
<!-- Header Banner / Logo -->
<div class="bg-surface-container rounded-[24px] p-stack-md flex items-center gap-stack-md shadow-sm border border-surface-variant">
<div class="w-12 h-12 rounded-[12px] bg-white flex items-center justify-center shrink-0">
<img class="w-8 h-8 object-contain" data-alt="A clean, minimalist logo icon representing the Nepal Electricity Authority (NEA). The design features a stylized lightning bolt or lightbulb motif in a modern, corporate aesthetic. The colors are bright white and electric green, suggesting energy and reliability. The logo is centered within a square format with rounded corners, typical of a mobile app icon." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAXydAzU7DKQHjF6bzIZnOW-LuboyLOv9WoF_4Ce8dwRzn80QijW5e1SWkIk7WBfXkr6-TnjVlm10y8-FuKT3cggqml7B3SSeOE0eZHzoHAdO_IcC55FJD8vHweQXWFUF6Y6Ag-NPnUpb4z93duzllyYoHw-IqASD937_QMVSHwdHG7aa3NgEnCiGTsd30VzOmjss424ShRFQnrdkkYyiGlDPWOPRkeRs_DGIpn_FROiFjuOjDzNG7Yeg"/>
</div>
<div>
<h2 class="text-title-md font-title-md text-on-surface">Nepal Electricity Authority</h2>
<p class="text-body-md font-body-md text-on-surface-variant">Pay your NEA bills instantly</p>
</div>
</div>
<!-- Payment Form Container -->
<div class="bg-surface rounded-[24px] shadow-[0_4px_12px_rgba(0,0,0,0.5)] p-stack-md flex flex-col gap-stack-md">
<!-- NEA Branch Dropdown -->
<div class="flex flex-col gap-1">
<label class="text-label-lg font-label-lg text-on-surface-variant pl-2">NEA Branch</label>
<div class="relative">
<select class="w-full h-14 bg-surface-container border-0 text-on-surface text-body-lg font-body-lg rounded-full pl-4 pr-12 appearance-none focus:ring-2 focus:ring-primary focus:bg-surface-container-high transition-colors">
<option disabled="" selected="" value="">Select Branch</option>
<option value="kathmandu">Kathmandu Central</option>
<option value="lalitpur">Lalitpur</option>
<option value="bhaktapur">Bhaktapur</option>
<option value="pokhara">Pokhara</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" style="font-variation-settings: 'FILL' 0;">arrow_drop_down</span>
</div>
</div>
<!-- Customer ID Input -->
<div class="flex flex-col gap-1">
<label class="text-label-lg font-label-lg text-on-surface-variant pl-2">Customer ID</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container border-0 text-on-surface text-body-lg font-body-lg rounded-full px-4 focus:ring-2 focus:ring-primary focus:bg-surface-container-high transition-colors placeholder:text-on-surface-variant/50" placeholder="Enter Customer ID" type="number"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">person</span>
</div>
</div>
<!-- SC No Input -->
<div class="flex flex-col gap-1">
<label class="text-label-lg font-label-lg text-on-surface-variant pl-2">SC. No.</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container border-0 text-on-surface text-body-lg font-body-lg rounded-full px-4 focus:ring-2 focus:ring-primary focus:bg-surface-container-high transition-colors placeholder:text-on-surface-variant/50" placeholder="Enter SC. No. (e.g. 014.24.123)" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">pin</span>
</div>
</div>
<!-- Proceed Action -->
<button class="w-full h-14 bg-primary-container text-on-primary-container text-title-md font-title-md rounded-full mt-2 flex items-center justify-center gap-2 hover:bg-primary-container/90 active:scale-[0.98] transition-all shadow-[0_4px_12px_rgba(16,185,129,0.3)]">
                Proceed
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
<!-- Recent Customers Section -->
<div class="flex flex-col gap-stack-sm mt-stack-md">
<h3 class="text-label-lg font-label-lg text-on-surface-variant uppercase tracking-wider pl-2">Recent Customers</h3>
<div class="flex flex-col gap-gutter">
<!-- Recent Item 1 -->
<div class="bg-surface-container-low rounded-[16px] p-4 flex items-center justify-between active:bg-surface-variant transition-colors cursor-pointer border border-surface-variant/50">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-secondary-container" style="font-variation-settings: 'FILL' 0;">history</span>
</div>
<div class="flex flex-col">
<span class="text-title-md font-title-md text-on-surface">Home - Kathmandu</span>
<span class="text-body-md font-body-md text-on-surface-variant">ID: 12345678 • SC: 014.12.34</span>
</div>
</div>
</div>
<!-- Recent Item 2 -->
<div class="bg-surface-container-low rounded-[16px] p-4 flex items-center justify-between active:bg-surface-variant transition-colors cursor-pointer border border-surface-variant/50">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-secondary-container" style="font-variation-settings: 'FILL' 0;">history</span>
</div>
<div class="flex flex-col">
<span class="text-title-md font-title-md text-on-surface">Office - Lalitpur</span>
<span class="text-body-md font-body-md text-on-surface-variant">ID: 98765432 • SC: 021.05.99</span>
</div>
</div>
</div>
</div>
</div>
</main>
