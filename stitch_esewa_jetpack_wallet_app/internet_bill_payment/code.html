<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .ripple-effect {
            position: relative;
            overflow: hidden;
        }
        .ripple-effect::after {
            content: "";
            display: block;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, #000 10%, transparent 10.01%);
            background-repeat: no-repeat;
            background-position: 50%;
            transform: scale(10, 10);
            opacity: 0;
            transition: transform .5s, opacity 1s;
        }
        .ripple-effect:active::after {
            transform: scale(0, 0);
            opacity: .2;
            transition: 0s;
        }
        /* Tonal elevation level 1 */
        .elevation-1 {
            background-color: var(--surface-container-low, #f4f4ec);
            box-shadow: 0px 1px 2px 0px rgba(0, 0, 0, 0.30), 0px 1px 3px 1px rgba(0, 0, 0, 0.15);
        }
        /* Hide scrollbar for horizontal scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

<body class="bg-background text-on-background font-body-lg min-h-screen pb-24 md:pb-0">
<!-- Top App Bar -->
<header class="bg-primary dark:bg-primary docked full-width top-0 rounded-b-[24px] shadow-none flex justify-between items-center w-full px-margin-mobile py-4 sticky z-40">
<div class="flex items-center gap-3">
<button class="text-on-primary hover:bg-primary-container/20 p-2 rounded-full transition-colors ripple-effect">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-headline-md-mobile font-headline-md-mobile text-on-primary">Internet Bill</h1>
</div>
<div class="text-title-lg font-title-lg font-bold text-on-primary hidden md:block">
            Emerald
        </div>
</header>
<!-- Main Content Canvas -->

<!-- Search Section -->

</div>
</section>
<!-- Popular Providers Grid -->

<h2 class="text-title-md font-title-md text-on-surface mb-stack-md">Popular Providers</h2>
<div class="grid grid-cols-2 md:grid-cols-4 gap-gutter">
<!-- Provider 1 -->
<button class="flex flex-col items-center justify-center p-4 bg-surface-container-low rounded-[24px] hover:bg-surface-container-high transition-colors ripple-effect border border-transparent active:border-outline-variant">
<div class="w-12 h-12 rounded-[12px] bg-primary-container flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">router</span>
</div>
<span class="text-body-md font-body-md text-on-surface text-center">Worldlink</span>
</button>
<!-- Provider 2 -->
<button class="flex flex-col items-center justify-center p-4 bg-surface-container-low rounded-[24px] hover:bg-surface-container-high transition-colors ripple-effect border border-transparent active:border-outline-variant">

<span class="material-symbols-outlined text-on-tertiary-container" style="font-variation-settings: 'FILL' 1;">wifi</span>
</div>
<span class="text-body-md font-body-md text-on-surface text-center">Vianet</span>
</button>
<!-- Provider 3 -->
<button class="flex flex-col items-center justify-center p-4 bg-surface-container-low rounded-[24px] hover:bg-surface-container-high transition-colors ripple-effect border border-transparent active:border-outline-variant">
<div class="w-12 h-12 rounded-[12px] bg-error-container flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-on-error-container" style="font-variation-settings: 'FILL' 1;">language</span>
</div>
<span class="text-body-md font-body-md text-on-surface text-center">Subisu</span>
</button>
<!-- Provider 4 -->
<button class="flex flex-col items-center justify-center p-4 bg-surface-container-low rounded-[24px] hover:bg-surface-container-high transition-colors ripple-effect border border-transparent active:border-outline-variant">
<div class="w-12 h-12 rounded-[12px] bg-secondary-container flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">cell_tower</span>
</div>

</button>
</div>
