<body class="bg-background text-on-background font-body-md antialiased min-h-screen">

<main class="pt-24 pb-28 px-margin-mobile max-w-lg mx-auto">
<!-- Progress Header -->
<section class="mb-stack-lg">
<div class="flex justify-between items-end mb-2">
<div>
<h2 class="text-title-lg font-title-lg text-primary">KYC Verification</h2>
<p class="text-body-md font-body-md text-on-surface-variant">Step 1 of 4: Personal Info</p>
</div>
<span class="text-label-lg font-label-lg text-primary font-bold">25%</span>
</div>
<div class="h-2 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-1/4 rounded-full transition-all duration-500 ease-out"></div>
</div>

<!-- Form Card -->
<div class="bg-surface p-6 rounded-[24px] shadow-sm border border-outline-variant/30">
<form class="space-y-stack-md" id="kycForm">
<!-- First Name -->
<div class="relative group">
<label class="block text-label-lg font-label-lg text-outline mb-1 px-1" for="firstName">First Name</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-on-secondary-fixed-variant" id="firstName" name="firstName" placeholder="e.g. Upendra" required="" type="text"/>
<p class="hidden text-error text-label-lg mt-1 px-1" id="error-firstName">Please enter your first name as per citizenship.</p>
</div>
<!-- Middle Name -->
<div class="relative">
<label class="block text-label-lg font-label-lg text-outline mb-1 px-1" for="middleName">Middle Name (Optional)</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-on-secondary-fixed-variant" id="middleName" name="middleName" placeholder="e.g. Bahadur" type="text"/>
</div>
<!-- Last Name -->
<div class="relative">
<label class="block text-label-lg font-label-lg text-outline mb-1 px-1" for="lastName">Last Name</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-on-secondary-fixed-variant" id="lastName" name="lastName" placeholder="e.g. Khatri" required="" type="text"/>
</div>
<!-- Gender Grid -->
<div>
<label class="block text-label-lg font-label-lg text-outline mb-2 px-1">Gender</label>
<div class="grid grid-cols-3 gap-3">
<label class="cursor-pointer">
<input checked="" class="hidden peer" name="gender" type="radio" value="male"/>
<div class="flex flex-col items-center justify-center p-3 rounded-xl border border-outline-variant bg-surface-container-low peer-checked:bg-primary-container/20 peer-checked:border-primary peer-checked:text-primary transition-all">
<span class="material-symbols-outlined mb-1">male</span>
<span class="text-label-lg">Male</span>
</div>
</label>
<label class="cursor-pointer">
<input class="hidden peer" name="gender" type="radio" value="female"/>
<div class="flex flex-col items-center justify-center p-3 rounded-xl border border-outline-variant bg-surface-container-low peer-checked:bg-primary-container/20 peer-checked:border-primary peer-checked:text-primary transition-all">
<span class="material-symbols-outlined mb-1">female</span>
<span class="text-label-lg">Female</span>
</div>
</label>
<label class="cursor-pointer">
<input class="hidden peer" name="gender" type="radio" value="other"/>
<div class="flex flex-col items-center justify-center p-3 rounded-xl border border-outline-variant bg-surface-container-low peer-checked:bg-primary-container/20 peer-checked:border-primary peer-checked:text-primary transition-all">
<span class="material-symbols-outlined mb-1">transgender</span>
<span class="text-label-lg">Other</span>
</div>
</label>
</div>
</div>
<!-- Date of Birth -->
<div class="relative">
<label class="block text-label-lg font-label-lg text-outline mb-1 px-1" for="dob">Date of Birth</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all appearance-none" id="dob" name="dob" required="" type="date"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none">calendar_today</span>
</div>
</div>
<!-- Occupation -->
<div class="relative">
<label class="block text-label-lg font-label-lg text-outline mb-1 px-1" for="occupation">Occupation</label>
<div class="relative">
<select class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all appearance-none pr-10" id="occupation" name="occupation" required="">
<option disabled="" selected="" value="">Select occupation</option>
<option value="student">Student</option>
<option value="private">Private Sector</option>
<option value="government">Government Employee</option>
<option value="business">Business Owner</option>
<option value="retired">Retired</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<div class="pt-4">
<button class="w-full bg-primary-container text-on-primary-container font-title-md py-4 rounded-full shadow-lg active:scale-[0.98] transition-transform flex justify-center items-center gap-2" type="submit">
<span>Continue</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center text-label-lg text-on-secondary-fixed-variant mt-4">
                        Information provided here is kept secure and confidential.

<span class="text-label-lg font-label-lg">Statement</span>

<span class="material-symbols-outlined">more_horiz</span>
<span class="text-label-lg font-label-lg">More</span>
</a>

<script>
        document.getElementById('kycForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Simple validation simulation
            const firstName = document.getElementById('firstName');
            const errorText = document.getElementById('error-firstName');
            
            if (firstName.value.trim().length < 2) {
                firstName.classList.add('border-error', 'text-error');
                errorText.classList.remove('hidden');
            } else {
                firstName.classList.remove('border-error', 'text-error');
                errorText.classList.add('hidden');
                // Proceed to next step animation simulation
                alert('Success! Moving to Step 2...');
            }
        });

        // Date picker enhancement for mobile touch
        const dobInput = document.getElementById('dob');
        dobInput.addEventListener('focus', function() {
            this.showPicker();
        });
    </script>
