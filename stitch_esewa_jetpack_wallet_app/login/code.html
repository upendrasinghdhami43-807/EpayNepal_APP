<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Esewa</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "error": "#ba1a1a",
                      "surface-container": "#eeeee6",
                      "primary-fixed-dim": "#54e24e",
                      "secondary-container": "#e4e3da",
                      "on-tertiary-container": "#18484a",
                      "on-error-container": "#93000a",
                      "secondary-fixed": "#e4e3da",
                      "primary": "#006e0d",
                      "surface-container-highest": "#e3e3db",
                      "on-secondary-container": "#64655e",
                      "surface-variant": "#e3e3db",
                      "tertiary-container": "#88b6b8",
                      "tertiary": "#396668",
                      "on-secondary-fixed": "#1b1c17",
                      "surface-tint": "#006e0d",
                      "on-surface-variant": "#3d4a39",
                      "surface": "#fafaf2",
                      "on-background": "#1a1c18",
                      "surface-container-low": "#f4f4ec",
                      "secondary-fixed-dim": "#c8c7bf",
                      "on-tertiary-fixed": "#002021",
                      "inverse-primary": "#54e24e",
                      "background": "#fafaf2",
                      "outline": "#6d7b68",
                      "on-surface": "#1a1c18",
                      "on-primary-fixed-variant": "#005307",
                      "outline-variant": "#bccbb4",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed": "#002201",
                      "inverse-surface": "#2f312c",
                      "on-primary": "#ffffff",
                      "inverse-on-surface": "#f1f1e9",
                      "tertiary-fixed": "#bcebed",
                      "on-tertiary-fixed-variant": "#1f4d50",
                      "tertiary-fixed-dim": "#a0cfd1",
                      "primary-fixed": "#75ff69",
                      "on-secondary-fixed-variant": "#474741",
                      "primary-container": "#37c837",
                      "on-secondary": "#ffffff",
                      "on-error": "#ffffff",
                      "on-primary-container": "#004d06",
                      "surface-container-high": "#e8e9e1",
                      "surface-container-lowest": "#ffffff",
                      "error-container": "#ffdad6",
                      "surface-dim": "#dadad3",
                      "surface-bright": "#fafaf2",
                      "secondary": "#5e5f58"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "12px",
                      "stack-lg": "24px",
                      "stack-sm": "8px",
                      "margin-mobile": "16px",
                      "margin-desktop": "24px",
                      "stack-md": "16px"
              },
              "fontFamily": {
                      "body-lg": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "headline-md": ["Inter"],
                      "display-lg": ["Inter"],
                      "title-md": ["Inter"],
                      "label-lg": ["Inter"],
                      "title-lg": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-md": ["Inter"]
              },
              "fontSize": {
                      "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                      "headline-md": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                      "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400"}],
                      "title-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "600"}],
                      "label-lg": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                      "title-lg": ["22px", {"lineHeight": "28px", "fontWeight": "500"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                      "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        .focused-label {
            transform: translateY(-24px) scale(0.85);
            color: var(--primary);
        }

        .m3-field:focus-within label {
            transform: translateY(-24px) scale(0.85);
            color: #006e0d; /* primary */
        }

        .m3-field:focus-within .outline-border {
            border-width: 2px;
            border-color: #006e0d;
        }

        .m3-field label {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
        
        input:not(:placeholder-shown) + label {
            transform: translateY(-24px) scale(0.85);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg overflow-hidden">
<!-- Top Decorative Header with Brand Anchor -->
<header class="relative h-[221px] w-full bg-primary overflow-hidden flex flex-col justify-end px-margin-mobile pb-stack-lg rounded-b-[40px]">
<!-- Animated Background Elements -->
<div class="absolute inset-0 opacity-20">
<div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-primary-fixed rounded-full blur-3xl"></div>
<div class="absolute bottom-[-20%] left-[-20%] w-80 h-80 bg-primary-container rounded-full blur-3xl animate-pulse"></div>
</div>
<div class="relative z-10">
<h1 class="text-on-primary font-headline-lg-mobile text-headline-lg-mobile">Welcome Back</h1>
<p class="text-on-primary-fixed-variant font-body-md text-body-md mt-1 opacity-90">Login to your Esewa account</p>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile -mt-8 relative z-20">
<div class="bg-surface rounded-[32px] p-6 shadow-xl shadow-on-background/5 flex flex-col gap-stack-lg">
<!-- Login Form -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Phone Number Field -->
<div class="m3-field relative group">
<div class="outline-border absolute inset-0 border border-outline rounded-xl pointer-events-none transition-all duration-200"></div>
<div class="flex items-center h-14 px-4">
<div class="flex items-center gap-1 border-r border-outline-variant pr-3 mr-3">
<span class="text-body-lg font-body-lg text-on-surface-variant">+977</span>
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">expand_more</span>
</div>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 text-body-lg font-body-lg text-on-surface" id="phone" placeholder=" " required="" type="tel"/>
<label class="absolute left-[84px] top-1/2 -translate-y-1/2 text-on-surface-variant font-body-lg bg-surface px-1 origin-left" for="phone">Phone Number</label>
</div>
</div>
<!-- Password Field -->
<div class="m3-field relative group">
<div class="outline-border absolute inset-0 border border-outline rounded-xl pointer-events-none transition-all duration-200"></div>
<div class="flex items-center h-14 px-4">
<input class="w-full bg-transparent border-none focus:ring-0 p-0 text-body-lg font-body-lg text-on-surface" id="password" placeholder=" " required="" type="password"/>
<label class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-body-lg bg-surface px-1 origin-left" for="password">Password</label>
<button class="text-on-surface-variant hover:text-primary transition-colors p-1" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember & Forgot -->
<div class="flex justify-between items-center px-1">
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer appearance-none w-5 h-5 border-2 border-outline rounded-md checked:bg-primary checked:border-primary transition-all duration-200" type="checkbox"/>
<span class="material-symbols-outlined absolute text-white scale-0 peer-checked:scale-100 transition-transform duration-200 text-[16px] left-[2px]">check</span>
</div>
<span class="text-label-lg font-label-lg text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Me</span>
</label>
<a class="text-primary font-label-lg text-label-lg hover:underline underline-offset-4" href="#">Forgot Password?</a>
</div>
<!-- Login Button -->
<button class="bg-primary-container text-on-primary-container h-14 rounded-full font-title-md text-title-md mt-4 shadow-md active:scale-95 transition-all duration-150 flex items-center justify-center gap-2 hover:bg-primary-container/90" type="submit">
                    Login
                </button>
<!-- Fingerprint Login -->
<button class="flex items-center justify-center gap-2 h-12 text-primary font-label-lg text-label-lg hover:bg-primary-container/10 rounded-full transition-colors" type="button">
<span class="material-symbols-outlined">fingerprint</span>
                    Fingerprint Login
                </button>
</form>
<div class="relative py-2">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant"></div></div>
<div class="relative flex justify-center text-label-lg font-label-lg uppercase tracking-wider"><span class="bg-surface px-4 text-on-secondary-fixed-variant">New to Esewa?</span></div>
</div>
<!-- Register Link -->
<button class="border border-outline text-on-surface h-12 rounded-full font-title-md text-title-md active:scale-95 transition-all duration-150 hover:bg-surface-container-low">
                Create Account
            </button>
</div>
</main>
<!-- App Identity / Bottom Branding Area -->
<footer class="mt-auto pb-8 pt-4 flex flex-col items-center gap-4">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="font-bold tracking-tight text-title-lg font-title-lg">Esewa Secure</span>
</div>
<div class="flex gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors cursor-pointer">
<span class="material-symbols-outlined text-[20px]">help_center</span>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors cursor-pointer">
<span class="material-symbols-outlined text-[20px]">language</span>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors cursor-pointer">
<span class="material-symbols-outlined text-[20px]">info</span>
</div>
</div>
</footer>
<!-- Background Atmospheric Effect -->
<div class="fixed inset-0 -z-10 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-primary-container/10 via-transparent to-transparent pointer-events-none"></div>
<script>
        function togglePassword() {
            const passInput = document.getElementById('password');
            const passIcon = document.getElementById('passIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passIcon.textContent = 'visibility_off';
            } else {
                passInput.type = 'password';
                passIcon.textContent = 'visibility';
            }
        }

        // Handle placeholder logic for Material 3 labels
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.m3-field').classList.add('focused');
            });
            input.addEventListener('blur', () => {
                input.closest('.m3-field').classList.remove('focused');
            });
        });
    </script>
</body></html>
