<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .otp-input:focus {
            box-shadow: 0 0 0 2px #006e0d;
        }
        .numpad-key:active {
            transform: scale(0.92);
        }
        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }
        .ripple-effect {
            position: relative;
            overflow: hidden;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center">
<!-- Header Suppression Rule Applied (Transactional Screen) -->
<main class="w-full max-w-md flex-1 flex flex-col px-margin-mobile pt-12 pb-8">
<!-- Brand Logo & Back Button -->
<div class="flex items-center justify-between mb-stack-lg">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="h-8">
<!-- Simple branding anchor placeholder -->
<div class="w-24 h-8 bg-primary rounded-lg flex items-center justify-center px-2">
<span class="text-on-primary font-bold text-title-md">eSewa</span>
</div>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
<!-- Headline -->
<div class="mb-stack-lg">
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface mb-2">Verify Phone</h1>
<p class="text-body-md text-on-surface-variant">We've sent a 6-digit code to <span class="font-bold text-on-surface">+977 984****123</span>. Please enter it below to proceed.</p>
</div>
<!-- OTP Input Section -->
<div class="flex justify-between gap-2 mb-stack-lg">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-title-lg font-bold bg-surface-container-low border border-outline-variant rounded-2xl focus:outline-none transition-all" id="otp-1" maxlength="1" readonly="" type="text"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-title-lg font-bold bg-surface-container-low border border-outline-variant rounded-2xl focus:outline-none transition-all" id="otp-2" maxlength="1" readonly="" type="text"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-title-lg font-bold bg-surface-container-low border border-outline-variant rounded-2xl focus:outline-none transition-all" id="otp-3" maxlength="1" readonly="" type="text"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-title-lg font-bold bg-surface-container-low border border-outline-variant rounded-2xl focus:outline-none transition-all" id="otp-4" maxlength="1" readonly="" type="text"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-title-lg font-bold bg-surface-container-low border border-outline-variant rounded-2xl focus:outline-none transition-all" id="otp-5" maxlength="1" readonly="" type="text"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-title-lg font-bold bg-surface-container-low border border-outline-variant rounded-2xl focus:outline-none transition-all" id="otp-6" maxlength="1" readonly="" type="text"/>
</div>
<!-- Timer & Resend -->
<div class="flex flex-col items-center mb-stack-lg">
<p class="text-body-md text-on-surface-variant mb-1" id="timer-text">Resend code in <span class="font-bold text-primary">00:59</span></p>
<button class="text-label-lg font-label-lg text-outline cursor-not-allowed" disabled="" id="resend-btn">
                Resend Code
            </button>
</div>
<!-- Spacer to push keypad down -->
<div class="flex-grow"></div>
<!-- Numeric Keypad -->
<div class="grid grid-cols-3 gap-y-4 gap-x-8 mb-stack-lg px-4">
<button class="numpad-key py-4 text-title-lg font-bold text-on-surface hover:bg-surface-container-highest rounded-2xl transition-all" onclick="keyPress('1')">1</button>
<button class="numpad-key py-4 text-title-lg font-bold text-on-surface hover:bg-surface-container-highest rounded-2xl transition-all" onclick="keyPress('2')">2</button>
<button class="numpad-key py-4 text-title-lg font-bold text-on-surface hover:bg-surface-container-highest rounded-2xl transition-all" onclick="keyPress('3')">3</button>
<button class="numpad-key py-4 text-title-lg font-bold text-on-surface hover:bg-surface-container-highest rounded-2xl transition-all" onclick="keyPress('4')">4</button>
<button class="numpad-key py-4 text-title-lg font-bold text-on-surface hover:bg-surface-container-highest rounded-2xl transition-all" onclick="keyPress('5')">5</button>
<button class="numpad-key py-4 text-title-lg font-bold text-on-surface hover:bg-surface-container-highest rounded-2xl transition-all" onclick="keyPress('6')">6</button>
<button class="numpad-key py-4 text-title-lg font-bold text-on-surface hover:bg-surface-container-highest rounded-2xl transition-all" onclick="keyPress('7')">7</button>
<button class="numpad-key py-4 text-title-lg font-bold text-on-surface hover:bg-surface-container-highest rounded-2xl transition-all" onclick="keyPress('8')">8</button>
<button class="numpad-key py-4 text-title-lg font-bold text-on-surface hover:bg-surface-container-highest rounded-2xl transition-all" onclick="keyPress('9')">9</button>
<div class="flex items-center justify-center">
<span class="material-symbols-outlined text-outline">fingerprint</span>
</div>
<button class="numpad-key py-4 text-title-lg font-bold text-on-surface hover:bg-surface-container-highest rounded-2xl transition-all" onclick="keyPress('0')">0</button>
<button class="numpad-key py-4 flex items-center justify-center text-on-surface hover:bg-surface-container-highest rounded-2xl transition-all" onclick="backspace()">
<span class="material-symbols-outlined text-3xl">backspace</span>
</button>
</div>
<!-- Primary Action Button -->
<button class="w-full py-4 bg-primary-container text-on-primary-container font-title-md rounded-2xl shadow-lg active:scale-95 transition-all opacity-50 cursor-not-allowed" disabled="" id="verify-btn">
            Verify
        </button>
</main>
<script>
        let currentOtp = [];
        const otpInputs = [
            document.getElementById('otp-1'),
            document.getElementById('otp-2'),
            document.getElementById('otp-3'),
            document.getElementById('otp-4'),
            document.getElementById('otp-5'),
            document.getElementById('otp-6')
        ];
        const verifyBtn = document.getElementById('verify-btn');

        function keyPress(num) {
            if (currentOtp.length < 6) {
                currentOtp.push(num);
                updateOtpUI();
            }
        }

        function backspace() {
            if (currentOtp.length > 0) {
                currentOtp.pop();
                updateOtpUI();
            }
        }

        function updateOtpUI() {
            otpInputs.forEach((input, index) => {
                input.value = currentOtp[index] || '';
                if (index === currentOtp.length) {
                    input.classList.add('border-primary');
                    input.classList.remove('border-outline-variant');
                } else {
                    input.classList.remove('border-primary');
                    input.classList.add('border-outline-variant');
                }
            });

            if (currentOtp.length === 6) {
                verifyBtn.disabled = false;
                verifyBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                verifyBtn.classList.add('bg-primary', 'text-on-primary');
            } else {
                verifyBtn.disabled = true;
                verifyBtn.classList.add('opacity-50', 'cursor-not-allowed');
                verifyBtn.classList.remove('bg-primary', 'text-on-primary');
            }
        }

        // Countdown Timer Logic
        let secondsLeft = 60;
        const timerText = document.getElementById('timer-text');
        const resendBtn = document.getElementById('resend-btn');

        const countdown = setInterval(() => {
            secondsLeft--;
            const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
            const s = (secondsLeft % 60).toString().padStart(2, '0');
            timerText.innerHTML = `Resend code in <span class="font-bold text-primary">${m}:${s}</span>`;

            if (secondsLeft <= 0) {
                clearInterval(countdown);
                timerText.classList.add('hidden');
                resendBtn.disabled = false;
                resendBtn.classList.remove('text-outline', 'cursor-not-allowed');
                resendBtn.classList.add('text-primary', 'font-bold');
            }
        }, 1000);

        // Micro-interaction for primary button
        verifyBtn.addEventListener('click', () => {
            if (!verifyBtn.disabled) {
                verifyBtn.innerHTML = `
                    <div class="flex items-center justify-center">
                        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Verifying...
                    </div>
                `;
                // Mock success
                setTimeout(() => {
                   verifyBtn.innerHTML = 'Verified Successfully';
                   verifyBtn.classList.replace('bg-primary', 'bg-tertiary');
                }, 1500);
            }
        });

        // Initialize UI
        updateOtpUI();
    </script>
</body></html>
