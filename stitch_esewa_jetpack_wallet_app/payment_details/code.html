<style>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pb-24">
<!-- TopAppBar from JSON -->
<header class="bg-primary text-on-primary docked full-width top-0 rounded-b-3xl shadow-none flex justify-between items-center w-full px-margin-mobile py-4 z-40 sticky">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-container">
<img class="w-full h-full object-cover" data-alt="A professional close-up portrait of a user with a subtle smile, soft natural lighting, modern fintech app context, clear focus on the face." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCuxkIHQPTNBLGVqdfoMzm9EHDu1Oo18QrM7U8-mZuV-oY5JoJ1CWaIIKunEovJ6NSufUavk0StbSOmWQOuVjDBk830KDnWs7krLGVD4y981eJ09eNkm6cYZ8pRrJsTxDfzUYwtjjonwrSUde_vL46tOwuzxl2rYko-ejX3iv09bwZNPbH-D5dcUSK92KTzBd5z4vEJRj-aAkPnM1dmoCxPIhFPSE3tLZ5Oxnvtd6knQro70r6NUACxcu3jg7S0FVZ9GN8XWD20oDy2">
</div>
<h1 class="text-headline-md-mobile font-headline-md-mobile">Hi, Upendra</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-on-primary" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col max-w-md mx-auto w-full relative z-10">
<!-- Receiver Details Card -->
<section class="mx-margin-mobile mt-stack-lg p-stack-md bg-surface-container-lowest rounded-[24px] shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant/20 flex flex-row items-center gap-stack-md">
<div class="w-12 h-12 rounded-xl overflow-hidden bg-surface-container-high flex-shrink-0 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-[24px]" data-icon="person">person</span>
</div>
<div class="flex flex-col">
<span class="text-label-lg font-label-lg text-on-surface-variant uppercase tracking-wider mb-1">Sending to</span>
<h2 class="text-title-md font-title-md text-on-surface">Upendra Sharma</h2>
<p class="text-body-md font-body-md text-on-surface-variant">98XXXXXXXX</p>
</div>
</section>
<!-- Enter Amount Section -->
<section class="mx-margin-mobile mt-stack-lg p-stack-lg bg-surface-container-lowest rounded-[24px] shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant/20 flex flex-col items-center justify-center">
<label class="text-body-lg font-body-lg text-on-surface-variant mb-stack-sm text-center" for="amountInput">Amount (NPR)</label>
<div class="flex items-center justify-center gap-2 w-full">
<span class="text-headline-lg-mobile font-headline-lg-mobile text-primary">रु.</span>
<input autofocus="" class="text-display-lg font-display-lg text-on-surface bg-transparent border-none focus:ring-0 text-center w-full max-w-[200px] p-0 placeholder-secondary-fixed-dim caret-primary" id="amountInput" placeholder="0" type="number">
</div>
<!-- Quick Amount Chips -->
<div class="flex flex-wrap justify-center gap-gutter mt-stack-md w-full"><button class="px-5 py-2 rounded-full border border-outline-variant/50 text-label-lg font-label-lg text-on-surface-variant hover:bg-primary-container/10 transition-colors bg-surface-container-low">500</button><button class="px-5 py-2 rounded-full border border-outline-variant/50 text-label-lg font-label-lg text-on-surface-variant hover:bg-primary-container/10 transition-colors bg-surface-container-low">1000</button><button class="px-5 py-2 rounded-full border border-outline-variant/50 text-label-lg font-label-lg text-on-surface-variant hover:bg-primary-container/10 transition-colors bg-surface-container-low">5000</button></div>
</section>
<!-- Remarks Section -->
<section class="mx-margin-mobile mt-stack-md bg-surface-container-low rounded-xl border border-outline-variant/10 overflow-hidden">
<div class="p-stack-md flex flex-row items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: &quot;FILL&quot; 1;">edit</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-body-lg font-body-lg text-on-surface p-0 placeholder-on-surface-variant/50 caret-primary" placeholder="Add a remark (Optional)" type="text">
</div>
</section>
</main>
<!-- Bottom Action Button (Fixed) -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-surface-container-lowest border-t border-outline-variant/20 z-50 flex justify-center">
<div class="max-w-md w-full">
<button class="w-full h-14 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center gap-2 shadow-[0_8px_16px_rgba(55,200,55,0.2)] ripple-effect active:scale-95 transition-transform duration-150">
<span class="text-title-md font-title-md">Proceed</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
<script>
        // Simple script to handle quick chip clicks to populate amount
        document.querySelectorAll('.gap-gutter button').forEach(button => {
            button.addEventListener('click', () => {
                const amount = button.innerText;
                document.getElementById('amountInput').value = amount;
                
                // Add a subtle bump animation to the input
                const input = document.getElementById('amountInput');
                input.style.transform = 'scale(1.05)';
                setTimeout(() => {
                    input.style.transform = 'scale(1)';
                    input.style.transition = 'transform 0.15s ease-in-out';
                }, 150);
            });
        });
    </script>
