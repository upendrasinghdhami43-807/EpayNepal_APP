<body class="bg-background text-on-background min-h-screen flex flex-col font-sans antialiased overflow-x-hidden">
<!-- Top App Bar -->
<header class="bg-primary text-on-primary docked full-width top-0 rounded-b-3xl shadow-none z-50 sticky">
<div class="flex justify-between items-center w-full px-margin-mobile py-4 max-w-7xl mx-auto">

</div>
</div>

</div>
</div>
</div>

<span class="font-title-md text-title-md">NPR</span>
<span class="material-symbols-outlined text-sm" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-headline-md text-headline-md text-on-surface-variant">Rs</span>

<button class="w-full bg-[#37C837] text-white font-title-lg text-title-lg py-4 rounded-[24px] shadow-[0_4px_12px_rgba(0,0,0,0.1)] hover:shadow-[0_6px_16px_rgba(0,0,0,0.15)] active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-2">
                Send Money

<a class="flex flex-col items-center justify-center text-on-secondary-fixed-variant px-4 py-1 hover:bg-secondary-container/50 ripple-effect active:scale-90 rounded-full transition-all" href="#">
