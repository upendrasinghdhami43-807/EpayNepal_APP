<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body-lg antialiased min-h-screen flex flex-col items-center">
<div class="w-full max-w-md bg-surface min-h-screen relative shadow-2xl flex flex-col">
<!-- Top App Bar - Linear/Transactional Intent (No nav shell rendered) -->
<header class="bg-surface-container-lowest text-on-surface docked full-width top-0 rounded-b-3xl shadow-none flex justify-between items-center w-full px-margin-mobile py-4 z-10 relative">
<button aria-label="Go back" class="text-on-surface hover:bg-surface-container/20 p-2 rounded-full transition-transform duration-150 active:scale-95 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-md-mobile font-headline-md-mobile font-bold tracking-tight">Report a Problem</h1>
<div class="w-10"></div> <!-- Spacer for alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile py-stack-lg space-y-stack-lg overflow-y-auto pb-32">
<!-- Category Selection Bento Grid -->
<section aria-labelledby="category-heading">
<h2 class="text-title-md font-title-md text-on-surface mb-stack-sm" id="category-heading">Select Category</h2>
<div class="grid grid-cols-2 gap-gutter">
<button class="bg-surface-container hover:bg-surface-container-high transition-colors rounded-2xl p-4 flex flex-col items-center justify-center gap-2 border border-outline-variant/30 focus:outline-none focus:ring-2 focus:ring-primary shadow-sm h-24">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="badge">badge</span>
<span class="text-label-lg font-label-lg text-on-surface">KYC</span>
</button>
<button class="bg-primary-container text-on-primary-container transition-colors rounded-2xl p-4 flex flex-col items-center justify-center gap-2 border border-primary focus:outline-none focus:ring-2 focus:ring-primary shadow-sm h-24 relative overflow-hidden">
<span class="material-symbols-outlined text-3xl z-10" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="text-label-lg font-label-lg z-10">Load Money</span>
<div class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent"></div>
</button>
<button class="bg-surface-container hover:bg-surface-container-high transition-colors rounded-2xl p-4 flex flex-col items-center justify-center gap-2 border border-outline-variant/30 focus:outline-none focus:ring-2 focus:ring-primary shadow-sm h-24">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="password">password</span>
<span class="text-label-lg font-label-lg text-on-surface">MPIN</span>
</button>
<button class="bg-surface-container hover:bg-surface-container-high transition-colors rounded-2xl p-4 flex flex-col items-center justify-center gap-2 border border-outline-variant/30 focus:outline-none focus:ring-2 focus:ring-primary shadow-sm h-24">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="receipt_long">receipt_long</span>
<span class="text-label-lg font-label-lg text-on-surface">Transaction</span>
</button>
<button class="bg-surface-container hover:bg-surface-container-high transition-colors rounded-2xl p-4 flex flex-col items-center justify-center gap-2 border border-outline-variant/30 focus:outline-none focus:ring-2 focus:ring-primary shadow-sm h-24 col-span-2">
<span class="material-symbols-outlined text-secondary text-3xl" data-icon="category">category</span>
<span class="text-label-lg font-label-lg text-on-surface">Others</span>
</button>
</div>
</section>
<!-- Detailed Description -->
<section aria-labelledby="details-heading">
<h2 class="text-title-md font-title-md text-on-surface mb-stack-sm flex justify-between items-baseline" id="details-heading">
                    Problem Details
                    <span class="text-label-lg font-label-lg text-on-surface-variant font-normal">0/500</span>
</h2>
<div class="relative">
<textarea class="w-full bg-surface-container-low border border-outline-variant rounded-2xl p-4 text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all resize-none shadow-sm" id="problem_description" placeholder="Please describe your issue in detail. Including error messages or specific transaction times helps us resolve it faster." rows="4"></textarea>
</div>
</section>
<!-- Image Upload Glassmorphism Style -->
<section aria-labelledby="upload-heading">
<h2 class="text-title-md font-title-md text-on-surface mb-stack-sm" id="upload-heading">Attachments</h2>
<div class="relative group cursor-pointer">
<div class="absolute inset-0 bg-primary-container/10 rounded-2xl backdrop-blur-md border border-primary/20 transition-colors group-hover:bg-primary-container/20"></div>
<div class="relative flex flex-col items-center justify-center p-stack-lg border-2 border-dashed border-primary/40 rounded-2xl gap-3">
<div class="bg-primary text-on-primary rounded-full p-3 shadow-md">
<span class="material-symbols-outlined text-2xl" data-icon="cloud_upload">cloud_upload</span>
</div>
<div class="text-center">
<p class="text-body-md font-body-md text-on-surface font-medium">Tap to upload screenshots</p>
<p class="text-label-lg font-label-lg text-on-surface-variant mt-1">JPEG, PNG up to 5MB</p>
</div>
</div>
</div>
<!-- Uploaded Thumbnail Placeholder -->
<div class="flex gap-3 mt-4 overflow-x-auto pb-2">
<div class="relative w-16 h-16 rounded-xl overflow-hidden shadow-sm border border-outline-variant flex-shrink-0">
<img alt="Uploaded screenshot thumbnail" class="w-full h-full object-cover" data-alt="A macro shot of a blurred mobile screen displaying a vague transaction error, soft focus, high key lighting, subtle green interface elements in the bokeh." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCqyPsaY52t8wNFuwfcK8RqsMaN8CV5aj7PwhvEIKCQKihMd0meESfwbGO_L47scKGoeEAigEg4X9xGJfAumN9uUQ9pFXAI4fc2TNq3lmGzLP5BooUc8qZM7yF6DGOm7oFIvU8lUOMueUXE7Z2Md36gvnJ0pRug7EgApEx1rEtlSZlY4BhjiiflLtnMS3aYLi3wpKPhUJr7sr3SPVJmXSJW7m2JHXJGI3JhndBBl8GN-CEVvXPx4RVhvA"/>
<button aria-label="Remove image" class="absolute -top-1 -right-1 bg-error text-on-error rounded-full w-5 h-5 flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[14px]" data-icon="close">close</span>
</button>
</div>
</div>
</section>
</main>
<!-- Sticky Footer Area -->
<footer class="bg-surface-container-lowest rounded-t-3xl shadow-[0_-4px_12px_rgba(0,0,0,0.2)] border-t border-outline-variant/20 p-margin-mobile absolute bottom-0 w-full z-20">
<!-- Submit Button (Primary Action) -->
<button class="w-full bg-primary text-on-primary text-title-md font-title-md rounded-full py-4 shadow-[0_4px_12px_rgba(84,226,78,0.2)] hover:bg-primary/90 transition-all active:scale-[0.98] flex justify-center items-center gap-2 mb-stack-md">
<span class="material-symbols-outlined" data-icon="send">send</span>
                Submit Report
            </button>
<!-- Grievance Officer Info -->
<div class="bg-surface-container-low rounded-2xl p-4 border border-outline-variant/30 flex flex-col gap-2">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-secondary text-sm" data-icon="admin_panel_settings">admin_panel_settings</span>
<h3 class="text-label-lg font-label-lg text-on-surface uppercase tracking-wider font-semibold">Grievance Officer</h3>
</div>
<div class="grid grid-cols-[auto_1fr] gap-x-3 gap-y-2 items-center">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]" data-icon="person">person</span>
<p class="text-body-md font-body-md text-on-surface">Mr. Kiran Sharma</p>
<span class="material-symbols-outlined text-on-surface-variant text-[18px]" data-icon="call">call</span>
<a class="text-body-md font-body-md text-primary hover:underline" href="tel:+97712345678">+977 1-2345678</a>
<span class="material-symbols-outlined text-on-surface-variant text-[18px]" data-icon="mail">mail</span>
<a class="text-body-md font-body-md text-primary hover:underline" href="mailto:grievance@esewa.com.np">grievance@esewa.com.np</a>
</div>
</div>
<div class="mt-4 flex justify-center">
<button class="text-primary text-label-lg font-label-lg flex items-center gap-1 hover:bg-primary-container/10 px-4 py-2 rounded-full transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="support_agent">support_agent</span>
                    Contact Support Directly
                </button>
</div>
</footer>
</div>
</body></html>
