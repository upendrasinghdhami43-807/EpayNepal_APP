<style>

<!-- Micro-interactions Script -->
<script>
        // Toggle Flash Interaction
        const flashBtn = document.querySelector('button[aria-label="Toggle Flash"]');
        let flashOn = false;
        flashBtn.addEventListener('click', () => {
            flashOn = !flashOn;
            flashBtn.querySelector('.material-symbols-outlined').textContent = flashOn ? 'flash_on' : 'flash_off';
            flashBtn.classList.toggle('bg-white/40');
            flashBtn.classList.toggle('text-yellow-400');
        });

        // Zoom Selection Interaction
        const zoomBtns = document.querySelectorAll('.flex.items-center.bg-white\\/20 button');
        zoomBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                zoomBtns.forEach(b => b.className = 'w-10 h-10 rounded-full text-white flex items-center justify-center font-bold text-sm hover:bg-white/10 transition-colors');
                btn.className = 'w-10 h-10 rounded-full bg-primary-container text-white flex items-center justify-center font-bold text-sm shadow-md';
            });
        });
    </script>
