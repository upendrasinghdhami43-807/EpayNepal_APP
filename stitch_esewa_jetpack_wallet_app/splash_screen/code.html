<style>
        @keyframes float {
            0% { transform: translateY(0px); filter: drop-shadow(0 0 15px rgba(255,255,255,0.2)); }
            50% { transform: translateY(-15px); filter: drop-shadow(0 0 30px rgba(255,255,255,0.4)); }
            100% { transform: translateY(0px); filter: drop-shadow(0 0 15px rgba(255,255,255,0.2)); }
        }

        @keyframes progress {
            0% { width: 0%; opacity: 0.5; }
            50% { width: 60%; opacity: 1; }
            100% { width: 100%; opacity: 0.8; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        .animate-progress {
            animation: progress 2.5s ease-in-out forwards;
        }

        .animate-fade-in {
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background-color: #37C837; /* Required explicit color */
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="h-screen w-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Splash Content Wrapper -->
<main class="flex flex-col items-center justify-center flex-grow animate-fade-in">
<!-- Animated Wallet Icon -->
<div class="relative mb-stack-lg">
<div class="animate-float flex items-center justify-center">
<span class="material-symbols-outlined text-[120px] text-on-primary" data-icon="account_balance_wallet" style="font-variation-settings: 'FILL' 1;">
                    account_balance_wallet
                </span>
</div>
<!-- Subtle Glow Ring behind icon -->
<div class="absolute inset-0 bg-white/20 blur-3xl rounded-full scale-150 -z-10"></div>
</div>
<!-- Brand Name -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-primary font-extrabold tracking-tight">
            Esewa
        </h1>
<!-- Optional Subtext -->
<p class="font-label-lg text-label-lg text-on-primary/80 mt-2 tracking-widest uppercase">
            Digital Payment
        </p>
</main>
<!-- Bottom Section: Loading & Version -->
<footer class="w-full max-w-xs flex flex-col items-center gap-stack-md pb-12 animate-fade-in" style="animation-delay: 0.2s;">
<!-- Progress Container -->
<div class="w-full h-1 bg-white/20 rounded-full overflow-hidden">
<div class="h-full bg-white animate-progress shadow-[0_0_8px_rgba(255,255,255,0.8)]"></div>
</div>
<!-- Version Info -->
<div class="text-center">
<span class="font-label-lg text-label-lg text-on-primary/70">
                v4.2.0
            </span>
</div>
</footer>
<!-- Background Decoration for Modern Depth -->
<div class="fixed top-[-10%] right-[-10%] w-[60%] h-[40%] bg-white/5 blur-[100px] rounded-full rotate-45 pointer-events-none"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[60%] h-[40%] bg-black/5 blur-[100px] rounded-full -rotate-12 pointer-events-none"></div>
