<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Mobile Topup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#1a1c18",
                        "on-primary": "#ffffff",
                        "secondary-container": "#e4e3da",
                        "tertiary-fixed": "#bcebed",
                        "primary": "#006e0d",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e3e3db",
                        "surface-bright": "#fafaf2",
                        "inverse-on-surface": "#f1f1e9",
                        "on-surface": "#1a1c18",
                        "on-secondary-fixed-variant": "#474741",
                        "inverse-surface": "#2f312c",
                        "on-primary-container": "#004d06",
                        "secondary-fixed-dim": "#c8c7bf",
                        "outline-variant": "#bccbb4",
                        "surface-container-low": "#f4f4ec",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "secondary": "#5e5f58",
                        "on-surface-variant": "#3d4a39",
                        "on-secondary-fixed": "#1b1c17",
                        "tertiary": "#396668",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "tertiary-container": "#88b6b8",
                        "primary-fixed": "#75ff69",
                        "on-primary-fixed": "#002201",
                        "on-tertiary-fixed-variant": "#1f4d50",
                        "surface-container-highest": "#e3e3db",
                        "primary-container": "#37c837",
                        "outline": "#6d7b68",
                        "on-secondary-container": "#64655e",
                        "surface-container": "#eeeee6",
                        "inverse-primary": "#54e24e",
                        "surface-dim": "#dadad3",
                        "on-tertiary-container": "#18484a",
                        "tertiary-fixed-dim": "#a0cfd1",
                        "secondary-fixed": "#e4e3da",
                        "surface-tint": "#006e0d",
                        "primary-fixed-dim": "#54e24e",
                        "surface": "#fafaf2",
                        "on-tertiary-fixed": "#002021",
                        "surface-container-high": "#e8e9e1",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#005307",
                        "background": "#fafaf2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "12px",
                        "stack-md": "16px",
                        "stack-lg": "24px",
                        "margin-desktop": "24px",
                        "stack-sm": "8px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "title-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "title-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400" }],
                        "label-lg": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1px", "fontWeight": "500" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }],
                        "title-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar for horizontal lists */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-primary text-on-primary docked full-width top-0 rounded-b-3xl shadow-none flex justify-between items-center w-full px-margin-mobile py-4 z-10 shrink-0">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined hover:bg-primary-container/20 p-2 rounded-full transition-colors active:scale-95 text-on-primary">arrow_back</button>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile">Topup</h1>
</div>
<button class="material-symbols-outlined hover:bg-primary-container/20 p-2 rounded-full transition-colors active:scale-95 text-on-primary">history</button>
</header>
<!-- Main Canvas -->
<main class="flex-1 overflow-y-auto px-margin-mobile py-stack-lg flex flex-col gap-stack-lg">
<!-- Tabs -->
<div class="flex bg-surface-container-high rounded-full p-1 shadow-sm">
<button class="flex-1 py-2 text-title-md font-title-md rounded-full bg-primary-container text-on-primary-container shadow-sm transition-all text-center">Topup</button>
<button class="flex-1 py-2 text-title-md font-title-md rounded-full text-on-surface-variant hover:bg-surface-variant transition-all text-center">Data Packs</button>
</div>
<!-- Mobile Number Input -->
<section class="flex flex-col gap-stack-sm">
<label class="text-body-md font-body-md text-on-surface-variant ml-1">Mobile Number</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant">phone_iphone</span>
<input class="w-full bg-surface-container rounded-full py-4 pl-12 pr-12 text-body-lg font-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary border-none shadow-sm transition-shadow" placeholder="Enter number" type="tel"/>
<button class="absolute right-2 p-2 rounded-full hover:bg-surface-variant text-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined">contacts</span>
</button>
</div>
</section>
<!-- Operator Selection -->
<section class="flex flex-col gap-stack-sm">
<label class="text-body-md font-body-md text-on-surface-variant ml-1">Select Operator</label>
<div class="grid grid-cols-3 gap-gutter">
<button class="bg-surface-container rounded-[24px] p-4 flex flex-col items-center justify-center gap-2 border-2 border-primary bg-primary/5 transition-all">
<div class="w-10 h-10 rounded-xl bg-surface-container-high flex items-center justify-center shadow-sm">
<span class="text-primary font-bold text-lg">NTC</span>
</div>
<span class="text-label-lg font-label-lg text-on-surface">Nepal Telecom</span>
</button>
<button class="bg-surface-container rounded-[24px] p-4 flex flex-col items-center justify-center gap-2 border-2 border-transparent hover:bg-surface-variant transition-all">
<div class="w-10 h-10 rounded-xl bg-surface-container-high flex items-center justify-center shadow-sm">
<span class="text-[#6C3483] font-bold text-lg">Ncell</span>
</div>
<span class="text-label-lg font-label-lg text-on-surface">Ncell</span>
</button>
<button class="bg-surface-container rounded-[24px] p-4 flex flex-col items-center justify-center gap-2 border-2 border-transparent hover:bg-surface-variant transition-all opacity-50 cursor-not-allowed">
<div class="w-10 h-10 rounded-xl bg-surface-container-high flex items-center justify-center shadow-sm">
<span class="text-[#E74C3C] font-bold text-lg">Smart</span>
</div>
<span class="text-label-lg font-label-lg text-on-surface">SmartCell</span>
</button>
</div>
</section>
<!-- Amount -->
<section class="flex flex-col gap-stack-sm">
<label class="text-body-md font-body-md text-on-surface-variant ml-1">Amount</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-title-lg font-title-lg text-on-surface-variant">Rs.</span>
<input class="w-full bg-surface-container rounded-full py-4 pl-14 pr-4 text-headline-md font-headline-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary border-none shadow-sm transition-shadow" placeholder="0" type="number"/>
</div>
<!-- Quick Chips -->
<div class="flex gap-gutter overflow-x-auto hide-scrollbar pb-2 pt-1">
<button class="shrink-0 px-6 py-2 rounded-full border border-outline-variant text-body-md font-body-md text-on-surface hover:bg-surface-variant transition-colors">50</button>
<button class="shrink-0 px-6 py-2 rounded-full border border-outline-variant text-body-md font-body-md text-on-surface hover:bg-surface-variant transition-colors bg-primary-container text-on-primary-container border-primary">100</button>
<button class="shrink-0 px-6 py-2 rounded-full border border-outline-variant text-body-md font-body-md text-on-surface hover:bg-surface-variant transition-colors">200</button>
<button class="shrink-0 px-6 py-2 rounded-full border border-outline-variant text-body-md font-body-md text-on-surface hover:bg-surface-variant transition-colors">500</button>
<button class="shrink-0 px-6 py-2 rounded-full border border-outline-variant text-body-md font-body-md text-on-surface hover:bg-surface-variant transition-colors">1000</button>
</div>
</section>
</main>
<!-- Bottom Action (Not Nav Shell) -->
<div class="px-margin-mobile py-stack-md bg-surface border-t border-outline-variant/30 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] shrink-0 z-20">
<button class="w-full bg-primary-container text-on-primary-container py-4 rounded-full text-title-md font-title-md shadow-md hover:shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2">
            Recharge Rs. 100
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</body></html>
