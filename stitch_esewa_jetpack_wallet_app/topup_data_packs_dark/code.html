<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Mobile Topup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#e2e2e8",
                        "on-primary": "#ffffff",
                        "secondary-container": "#272a2e",
                        "tertiary-fixed": "#bcebed",
                        "primary": "#10b981",
                        "error-container": "#93000a",
                        "surface-variant": "#2a2d31",
                        "surface-bright": "#3b3f46",
                        "inverse-on-surface": "#131313",
                        "on-surface": "#e2e2e8",
                        "on-secondary-fixed-variant": "#c4c7c5",
                        "inverse-surface": "#e2e2e8",
                        "on-primary-container": "#ffffff",
                        "secondary-fixed-dim": "#44474e",
                        "outline-variant": "#444746",
                        "surface-container-low": "#1c1f23",
                        "on-error-container": "#ffdad6",
                        "error": "#ffb4ab",
                        "secondary": "#a9c8b7",
                        "on-surface-variant": "#c4c7c5",
                        "on-secondary-fixed": "#101e17",
                        "tertiary": "#a0cfd1",
                        "surface-container-lowest": "#0f1115",
                        "on-error": "#690005",
                        "tertiary-container": "#1f4d50",
                        "primary-fixed": "#75ff69",
                        "on-primary-fixed": "#002201",
                        "on-tertiary-fixed-variant": "#1f4d50",
                        "surface-container-highest": "#363a40",
                        "primary-container": "#047857",
                        "outline": "#8e918f",
                        "on-secondary-container": "#c5e4d2",
                        "surface-container": "#1f2226",
                        "inverse-primary": "#006e0d",
                        "surface-dim": "#131313",
                        "on-tertiary-container": "#bcebed",
                        "tertiary-fixed-dim": "#a0cfd1",
                        "secondary-fixed": "#c5e4d2",
                        "surface-tint": "#54e24e",
                        "primary-fixed-dim": "#54e24e",
                        "surface": "#131313",
                        "on-tertiary-fixed": "#002021",
                        "surface-container-high": "#2b2f34",
                        "on-secondary": "#153423",
                        "on-tertiary": "#003739",
                        "on-primary-fixed-variant": "#005307",
                        "background": "#131313"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "12px",
                        "stack-md": "16px",
                        "stack-lg": "24px",
                        "margin-desktop": "24px",
                        "stack-sm": "8px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "title-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "title-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400" }],
                        "label-lg": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1px", "fontWeight": "500" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }],
                        "title-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar for horizontal lists */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background antialiased h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-surface-container text-on-surface docked full-width top-0 rounded-b-3xl shadow-none flex justify-between items-center w-full px-margin-mobile py-4 z-10 shrink-0">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined hover:bg-surface-variant p-2 rounded-full transition-colors active:scale-95 text-on-surface">arrow_back</button>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile">Topup</h1>
</div>
<button class="material-symbols-outlined hover:bg-surface-variant p-2 rounded-full transition-colors active:scale-95 text-on-surface">history</button>
</header>
<!-- Main Canvas -->
<main class="flex-1 overflow-y-auto px-margin-mobile py-stack-lg flex flex-col gap-stack-lg">
<!-- Tabs -->
<div class="flex bg-surface-container-high rounded-full p-1 shadow-sm">
<button class="flex-1 py-2 text-title-md font-title-md rounded-full bg-primary text-on-primary shadow-sm transition-all text-center">Topup</button>
<button class="flex-1 py-2 text-title-md font-title-md rounded-full text-on-surface-variant hover:bg-surface-variant transition-all text-center">Data Packs</button>
</div>
<!-- Mobile Number Input -->
<section class="flex flex-col gap-stack-sm">
<label class="text-body-md font-body-md text-on-surface-variant ml-1">Mobile Number</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant">phone_iphone</span>
<input class="w-full bg-surface-container rounded-full py-4 pl-12 pr-12 text-body-lg font-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary border-none shadow-sm transition-shadow placeholder-on-surface-variant" placeholder="Enter number" type="tel"/>
<button class="absolute right-2 p-2 rounded-full hover:bg-surface-variant text-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined">contacts</span>
</button>
</div>
</section>
<!-- Operator Selection -->
<section class="flex flex-col gap-stack-sm">
<label class="text-body-md font-body-md text-on-surface-variant ml-1">Select Operator</label>
<div class="grid grid-cols-3 gap-gutter">
<button class="bg-surface-container rounded-[24px] p-4 flex flex-col items-center justify-center gap-2 border-2 border-primary bg-primary/10 transition-all">
<div class="w-10 h-10 rounded-xl bg-surface-variant flex items-center justify-center shadow-sm">
<span class="text-primary font-bold text-lg">NTC</span>
</div>
<span class="text-label-lg font-label-lg text-on-surface">Nepal Telecom</span>
</button>
<button class="bg-surface-container rounded-[24px] p-4 flex flex-col items-center justify-center gap-2 border-2 border-transparent hover:bg-surface-variant transition-all">
<div class="w-10 h-10 rounded-xl bg-surface-variant flex items-center justify-center shadow-sm">
<span class="text-[#b16cd3] font-bold text-lg">Ncell</span>
</div>
<span class="text-label-lg font-label-lg text-on-surface">Ncell</span>
</button>
<button class="bg-surface-container rounded-[24px] p-4 flex flex-col items-center justify-center gap-2 border-2 border-transparent hover:bg-surface-variant transition-all opacity-50 cursor-not-allowed">
<div class="w-10 h-10 rounded-xl bg-surface-variant flex items-center justify-center shadow-sm">
<span class="text-[#fc8476] font-bold text-lg">Smart</span>
</div>
<span class="text-label-lg font-label-lg text-on-surface">SmartCell</span>
</button>
</div>
</section>
<!-- Amount -->
<section class="flex flex-col gap-stack-sm">
<label class="text-body-md font-body-md text-on-surface-variant ml-1">Amount</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-title-lg font-title-lg text-on-surface-variant">Rs.</span>
<input class="w-full bg-surface-container rounded-full py-4 pl-14 pr-4 text-headline-md font-headline-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary border-none shadow-sm transition-shadow placeholder-on-surface-variant" placeholder="0" type="number"/>
</div>
<!-- Quick Chips -->
<div class="flex gap-gutter overflow-x-auto hide-scrollbar pb-2 pt-1">
<button class="shrink-0 px-6 py-2 rounded-full border border-outline-variant text-body-md font-body-md text-on-surface hover:bg-surface-variant transition-colors">50</button>
<button class="shrink-0 px-6 py-2 rounded-full border border-primary text-body-md font-body-md text-on-primary hover:bg-primary-container transition-colors bg-primary">100</button>
<button class="shrink-0 px-6 py-2 rounded-full border border-outline-variant text-body-md font-body-md text-on-surface hover:bg-surface-variant transition-colors">200</button>
<button class="shrink-0 px-6 py-2 rounded-full border border-outline-variant text-body-md font-body-md text-on-surface hover:bg-surface-variant transition-colors">500</button>
<button class="shrink-0 px-6 py-2 rounded-full border border-outline-variant text-body-md font-body-md text-on-surface hover:bg-surface-variant transition-colors">1000</button>
</div>
</section>
</main>
<!-- Bottom Action (Not Nav Shell) -->
<div class="px-margin-mobile py-stack-md bg-surface border-t border-outline-variant/30 shadow-[0_-4px_12px_rgba(0,0,0,0.2)] shrink-0 z-20">
<button class="w-full bg-primary text-on-primary py-4 rounded-full text-title-md font-title-md shadow-md hover:shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2">
            Recharge Rs. 100
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</body></html>
